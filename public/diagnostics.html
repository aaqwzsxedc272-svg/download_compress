<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Connection check — Squeeze</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c8f560'/%3E%3Cpath d='M9 12h14M11 16h10M13 20h6' stroke='%230b0d0e' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>

<header class="site-header">
  <a class="brand" href="/">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 8h14M7 12h10M9 16h6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </span>
    <span class="brand-name">Squeeze</span>
  </a>
  <div class="header-meta"><a class="pill" href="/">← Back</a></div>
</header>

<main class="wrap">
  <section class="hero" style="padding-bottom:20px">
    <h1 style="font-size:clamp(26px,4.6vw,38px)">Connection check</h1>
    <p class="hero-sub">
      Each link needs two things: this server must be able to reach it, or your browser must be
      able to read it. This page tests both, from your machine, and tells you which one works.
    </p>
  </section>

  <section class="card" style="padding:16px">
    <div id="diagRows" class="diag-rows"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
      <button class="primary" id="rerun" type="button" style="margin-left:0">Run again</button>
      <button class="btn" id="copy" type="button">Copy report</button>
    </div>
  </section>

  <section class="card" style="padding:16px;margin-top:14px" id="verdictCard" hidden>
    <h2 style="font-size:15px;color:var(--muted);font-weight:600;margin-bottom:10px">What this means</h2>
    <div id="verdict" style="font-size:14px;line-height:1.65"></div>
  </section>
</main>

<footer class="site-footer">
  <span>Squeeze</span><span class="sep">·</span><span>diagnostics</span>
</footer>

<style>
  .diag-rows { display: flex; flex-direction: column; gap: 2px; }
  .diag-row {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    gap: 12px;
    align-items: baseline;
    padding: 11px 2px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 14px;
  }
  .diag-row:last-child { border-bottom: 0; }
  .diag-icon { font-family: var(--mono); font-size: 15px; }
  .diag-row.ok .diag-icon { color: var(--accent); }
  .diag-row.fail .diag-icon { color: var(--danger); }
  .diag-row.run .diag-icon { color: var(--muted); }
  .diag-label { min-width: 0; }
  .diag-detail { display: block; color: var(--dim); font-size: 12.5px; margin-top: 3px; font-family: var(--mono); word-break: break-word; }
  .diag-time { font-family: var(--mono); font-size: 11.5px; color: var(--dim); white-space: nowrap; }
</style>

<script src="/shared/resolve.js" defer></script>
<script src="/diagnostics.js" defer></script>
</body>
</html>
