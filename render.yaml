services:
  - type: web
    name: squeeze
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MAX_UPLOAD_MB
        value: 700          # free plan is 512 MB RAM; bigger files will be OOM-killed
      - key: MAX_CONCURRENT
        value: 1
